info:
  name: Solicitar adocao
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/adocoes
  body:
    type: json
    data: |-
      {
          "idPet": 1,
          "idTutor": 1,
          "motivo": "Motivo qualquer"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
